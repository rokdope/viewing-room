<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Rocky Yang — Selected Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#fff;
  --dim:rgba(255,255,255,.62);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.drag{cursor:grabbing}#scene.art{cursor:pointer}
#app::before,#app::after{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:3}
#app::before{top:0;height:160px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
#app::after{bottom:0;height:190px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.5))}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.t{all:unset;cursor:pointer;color:var(--ink)}
@media (hover:hover){.t:hover{opacity:.6}}
html,body,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.t:focus-visible{outline:1px solid #fff;outline-offset:3px}
#app>*:not(canvas){text-shadow:0 0 14px rgba(0,0,0,.45)}

#top{position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;display:grid;gap:10px;justify-items:start}
#top .name{font-size:30px;line-height:1;margin:0;font-weight:400}
.embed #top .name{display:none}
#rooms{display:flex;gap:14px;margin-top:6px}#rooms .on{opacity:1}#rooms a{color:#fff;text-decoration:none;opacity:.45}
#nav{display:grid;gap:1px;font-size:19px;line-height:1.15;justify-items:start}

#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:baseline;gap:34px;z-index:5;white-space:nowrap}
#counter{color:var(--dim)}

#map{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5}
#map canvas{display:block;width:96px;height:206px;cursor:crosshair;opacity:.85}

#panel{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(300px,calc(100% - 40px));z-index:6;display:grid;gap:8px;justify-items:end;text-align:right}
#p-title{margin:0;font-size:28px;line-height:1.05;font-weight:400}
#p-lines{display:grid;gap:3px;color:var(--dim)}
#p-acts{display:flex;gap:18px;margin-top:6px}

#intro{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.28)}
#intro .inner{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;gap:14px;justify-items:start}
#intro h1{margin:0;font-weight:400;font-size:clamp(40px,6vw,76px);line-height:.95}
#enter{font-size:22px}
#i-ctrl{color:var(--dim)}

.sheet-wrap{position:absolute;inset:0;z-index:20;background:#000;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 30px)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}
.sheet-head h2{margin:0;font-weight:400;font-size:30px;line-height:1}
.series{margin:30px 0 12px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 16px}
.item{all:unset;cursor:pointer;display:grid;gap:8px;min-width:0}
.item .thumb{aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.item img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.item .cap{color:var(--dim)}
.item:hover .cap{color:#fff}
.item:focus-visible{outline:1px solid #fff;outline-offset:4px}

#lightbox{position:absolute;inset:0;z-index:25;background:#000;display:grid;grid-template-rows:1fr auto;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
#lightbox .stage{min-height:0;display:grid;place-items:center}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#lightbox .bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#lb-title{color:var(--dim)}

#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 52px);max-width:calc(100% - 36px);text-align:center;margin:0;color:var(--dim);z-index:4;transition:opacity .5s}
#hint.fade{opacity:0}
#loading{position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 18px);z-index:11;color:var(--dim)}

#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);z-index:4;pointer-events:none;transition:width .12s,height .12s}
#cross.on{width:16px;height:16px;background:transparent;border:1px solid #fff}
#aim{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap}
#lockmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;display:grid;gap:8px;pointer-events:none;text-shadow:0 0 16px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.5)!important}
#lockmsg b{font-weight:400;font-size:24px}
#lockmsg span{color:var(--dim)}
@media (max-width:700px){
  #top .name{font-size:24px}#nav{font-size:17px}
  #map{left:auto;right:18px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
  #map canvas{width:56px;height:120px}
  #bottom{left:18px;right:18px;transform:none;justify-content:space-between;gap:0}
  #panel{left:18px;right:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);justify-items:start;text-align:left}
  #p-title{font-size:24px}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 50px)}
}
@media (max-height:640px) and (min-width:701px){#map canvas{width:68px;height:146px}}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:112px;height:112px;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(0,0,0,.14);z-index:5;touch-action:none;pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(255,255,255,.85);transition:transform .15s;pointer-events:none}
#joy.on i{transition:none}
.full #top .name{display:none}
@media (pointer:coarse){
  .t{padding:9px 8px;margin:-9px -8px}
  #nav{gap:6px}
  #map{left:auto;right:18px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
  #map canvas{width:56px;height:120px}
  #loading{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 52px)}
  #panel{left:auto;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:min(240px,calc(100% - 170px));justify-items:end;text-align:right}
  #p-title{font-size:24px}
  #hint{bottom:auto;top:calc(50% + 34px)}
}
@media (pointer:coarse) and (max-height:500px){
  #top .name{font-size:22px}#nav{font-size:16px;gap:2px}
  #map canvas{width:44px;height:94px}
  #intro h1{font-size:40px}
  #p-title{font-size:22px}
  #joy{width:96px;height:96px;bottom:calc(env(safe-area-inset-bottom,0px) + 48px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ================= navigation: obstacles, collisions, path finding ================= */
const RAD=.32;
const OBS=[[CYC.x0-.06,X1,CYC.face-CYC.cove,CYC.back],[RM.VANITY_X-.62,RM.VANITY_X+.62,CYC.back,CYC.back+.65],[RM.VANITY_X-.55,RM.VANITY_X+.72,CYC.back+.72,CYC.back+1.25],
  [X1-.15,X1,10.0,11.05],[X1-.22,X1,11.1,12.55],
  (O.bench[2]==='z'?[O.bench[0]-.21,O.bench[0]+.21,O.bench[1]-.9,O.bench[1]+.9]:[O.bench[0]-.9,O.bench[0]+.9,O.bench[1]-.21,O.bench[1]+.21]),...O.walls];
function resolve(p){
  p.x=Math.max(X0+RAD,Math.min(X1-RAD,p.x));p.z=Math.max(ZN+RAD,Math.min(ZS-RAD,p.z));
  for(const [a,b,c,d] of OBS){const x0=a-RAD,x1=b+RAD,z0=c-RAD,z1=d+RAD;
    if(p.x>x0&&p.x<x1&&p.z>z0&&p.z<z1){const dd=[p.x-x0,x1-p.x,p.z-z0,z1-p.z],k=dd.indexOf(Math.min(...dd));if(k===0)p.x=x0;else if(k===1)p.x=x1;else if(k===2)p.z=z0;else p.z=z1}}
  return p}
function segHits(ax,az,bx,bz,m){for(const [a,b,c,d] of OBS){const x0=a-m,x1=b+m,z0=c-m,z1=d+m;let t0=0,t1=1;const dx=bx-ax,dz=bz-az;let ok=true;
  for(const [p,q] of [[-dx,ax-x0],[dx,x1-ax],[-dz,az-z0],[dz,z1-az]]){if(Math.abs(p)<1e-9){if(q<0){ok=false;break}}else{const r=q/p;if(p<0){if(r>t1){ok=false;break}if(r>t0)t0=r}else{if(r<t0){ok=false;break}if(r<t1)t1=r}}}
  if(ok&&t0<t1)return true}return false}
const NODES=[];OBS.forEach(([a,b,c,d])=>{const m=RAD+.22;[[a-m,c-m],[a-m,d+m],[b+m,c-m],[b+m,d+m]].forEach(([x,z])=>{if(x>X0+RAD&&x<X1-RAD&&z>ZN+RAD&&z<ZS-RAD){const q=resolve({x,z});if(Math.hypot(q.x-x,q.z-z)<.01)NODES.push([x,z])}})});
function findPath(ax,az,bx,bz){
  if(!segHits(ax,az,bx,bz,RAD-.04))return[[bx,bz]];
  const pts=[[ax,az],...NODES,[bx,bz]],n=pts.length,dist=Array(n).fill(Infinity),prev=Array(n).fill(-1),done=Array(n).fill(false);dist[0]=0;
  for(let it=0;it<n;it++){let u=-1;for(let i=0;i<n;i++)if(!done[i]&&(u<0||dist[i]<dist[u]))u=i;if(u<0||dist[u]===Infinity)break;done[u]=true;if(u===n-1)break;
    for(let v=0;v<n;v++){if(done[v])continue;const [x0,z0]=pts[u],[x1,z1]=pts[v];const L=Math.hypot(x1-x0,z1-z0);if(dist[u]+L>=dist[v])continue;if(segHits(x0,z0,x1,z1,RAD-.04))continue;dist[v]=dist[u]+L;prev[v]=u}}
  if(dist[n-1]===Infinity)return[[bx,bz]];const out=[];let u=n-1;while(u>0){out.unshift(pts[u]);u=prev[u]}return out}

function travel(tx,tz,fyaw,fpitch,done){

  if(reduceMotion){p.x=tx;p.z=tz;yaw=fyaw??yaw;pitch=fpitch??0;if(done)done();return}
  let L=0,px=p.x,pz=p.z;path.forEach(([x,z])=>{L+=Math.hypot(x-px,z-pz);px=x;pz=z});
  move={path,seg:0,s:0,L,fyaw,fpitch,done,settle:0};

/* ================= input ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){const r=canvas.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
  return ray.intersectObjects([...pickables,...walkables,...occluders],false)[0]}
const ptr={down:false,id:null,x:0,y:0,sx:0,sy:0,moved:false};
const joy={id:null,f:0,s:0};const joyEl=$('#joy'),joyK=joyEl.firstElementChild;
function joyMove(e){const r=joyEl.getBoundingClientRect(),R0=r.width/2-8;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const d=Math.hypot(dx,dy);
  if(d>R0){dx*=R0/d;dy*=R0/d}joyK.style.transform=`translate(${dx}px,${dy}px)`;const m=Math.max(0,Math.min(1,(d-6)/(R0-6)))/(Math.hypot(dx,dy)||1);joy.f=-dy*m;joy.s=dx*m}
function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.f=joy.s=0;joyEl.classList.remove('on');joyK.style.transform=''}
joyEl.addEventListener('pointerdown',e=>{if(!entered||joy.id!==null)return;e.preventDefault();joy.id=e.pointerId;move=null;joyEl.classList.add('on');try{joyEl.setPointerCapture(e.pointerId)}catch(err){}joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joyEl.addEventListener(t,joyEnd));
canvas.addEventListener('pointerdown',e=>{if(!entered)return;if(isLocked())return;if(mode==='fps'&&e.pointerType==='mouse'){lock();return}
  if(ptr.down)return;ptr.down=true;ptr.id=e.pointerId;ptr.x=ptr.sx=e.clientX;ptr.y=ptr.sy=e.clientY;ptr.moved=false;try{canvas.setPointerCapture(e.pointerId)}catch(err){}});
canvas.addEventListener('pointermove',e=>{if(!entered||isLocked())return;
  if(ptr.down&&e.pointerId===ptr.id){const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;
    if(!ptr.moved&&Math.hypot(e.clientX-ptr.sx,e.clientY-ptr.sy)>6){ptr.moved=true;canvas.classList.add('drag');if(move&&move.done){move.done=null}}
    if(ptr.moved){const k=coarse?.0055:.0034;yaw+=dx*k;pitch=Math.max(-1.1,Math.min(1.1,pitch+dy*k));if(move){move.fyaw=null;move.fpitch=null}}}
  else if(!coarse){const h=pick(e);canvas.classList.toggle('art',!!(h&&h.object.userData.id))}});
function tapAt(e){const h=pick(e);if(!h)return;if(h.object.userData.id){focus(NUM[h.object.userData.id]);return}
  if(walkables.includes(h.object)){walkTo(h.point.x,h.point.z);return}
  if(h.face){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);if(Math.abs(n.y)<.5)walkTo(h.point.x+n.x*1.4,h.point.z+n.z*1.4)}}
function endPtr(e){if(isLocked())return;if(!ptr.down||e.pointerId!==ptr.id)return;ptr.down=false;canvas.classList.remove('drag');
  if(!ptr.moved&&e.type==='pointerup')tapAt(e)}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{if(!entered)return;e.preventDefault();move=null;const s=Math.max(-.6,Math.min(.6,-e.deltaY*.003)),p=cam.position;p.x-=Math.sin(yaw)*s;p.z-=Math.cos(yaw)*s;resolve(p);closePanel()},{passive:false});
const keys=new Set();
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#lightbox').hidden)$('#lightbox').hidden=true;else if(!$('#index').hidden)$('#index').hidden=true;else closePanel();return}
  if(!entered||!$('#index').hidden||!$('#lightbox').hidden)return;
  if(e.target.closest&&e.target.closest('button,input'))return;
  const k=e.code;if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyQ','KeyE'].includes(k)){keys.add(k);if(k.startsWith('Arrow'))e.preventDefault()}});
addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());

/* ================= first person (pointer lock) + fullscreen ================= */
const canLock=!coarse&&'requestPointerLock' in canvas;
let mode=canLock?'fps':'guide';
const isLocked=()=>document.pointerLockElement===canvas;
function setModeUI(){
  $('#lockmsg').hidden=!(entered&&mode==='fps'&&!isLocked()&&$('#index').hidden&&$('#lightbox').hidden&&$('#panel').hidden)}
function lock(){if(!canLock)return;try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{mode='guide';setModeUI();hint(6000)})}catch(e){}}
function hintMsg(t,ms){const h=$('#hint');h.textContent=t;h.hidden=false;h.classList.remove('fade');clearTimeout(hintT);hintT=setTimeout(()=>{h.classList.add('fade');setTimeout(()=>{h.hidden=true},400)},ms)}
document.addEventListener('pointerlockchange',()=>{const L=isLocked();$('#cross').hidden=!L;if(!L){$('#aim').hidden=true;keys.clear()}setModeUI()});
document.addEventListener('pointerlockerror',()=>{mode='guide';setModeUI()});
document.addEventListener('mousemove',e=>{if(!isLocked())return;const k=.0022;yaw-=e.movementX*k;pitch=Math.max(-1.25,Math.min(1.25,pitch-e.movementY*k));if(move){move.fyaw=null;move.fpitch=null}});
const centerV=new THREE.Vector2(0,0);
function pickCenter(){ray.setFromCamera(centerV,cam);return ray.intersectObjects([...pickables,...walkables,...occluders],false)[0]}
let aimT=0,aimId=null;
function updateAim(now){if(!isLocked()||now-aimT<90)return;aimT=now;const h=pickCenter();const id=h&&h.object.userData.id&&h.distance<7?h.object.userData.id:null;
  if(id!==aimId){aimId=id;$('#cross').classList.toggle('on',!!id);if(id){const w=W[id];$('#aim').textContent=w.t;$('#aim').hidden=false}else $('#aim').hidden=true}
  if(!$('#panel').hidden&&current>=0){const w=W[TOUR[current]];if(Math.hypot(w.pos.x-cam.position.x,w.pos.z-cam.position.z)>6.5)closePanel()}}
canvas.addEventListener('mousedown',e=>{if(!isLocked())return;e.preventDefault();if(aimId){current=NUM[aimId];$('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${TOUR.length}`;openPanel(W[aimId])}});
const fsEl=document.documentElement;
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const PSEUDO=new URLSearchParams(location.search).has('full');
const canPseudo=!fsOK&&!!ROOMS&&window.top!==window.self;
const SITE='https://rokdopesick.com/virtual-exhibition';
function fullHref(k){const q=new URLSearchParams(location.search);q.set('full','1');return (ROOMS?ROOMS[k||OPT]:location.pathname)+'?'+q.toString()+'#in'}
function exitPseudo(){if(history.length>1)history.back();else location.href=SITE}
const inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){try{if(inFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);if(r&&r.catch)r.catch(()=>{})}}catch(e){}}
$('#b-full').onclick=()=>{
  if(fsOK){toggleFS();setTimeout(()=>{if(mode==='fps'&&entered)lock()},250);return}
  if(PSEUDO){exitPseudo();return}
  if(canPseudo){const a=document.createElement('a');a.href=fullHref();a.target='_top';document.body.appendChild(a);a.click();a.remove()}};
const showFull=fsOK||canPseudo||PSEUDO;
if(PSEUDO){document.documentElement.classList.add('full');$('#b-full').textContent='Exit full screen'}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('#b-full').textContent=inFS()?'Exit full screen':'Full screen';setTimeout(resize,60)}));
addEventListener('keydown',e=>{if(e.code==='KeyF'&&entered&&!(e.target.closest&&e.target.closest('input'))&&fsOK){toggleFS()}});

/* ================= loop ================= */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?72:58;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),t0=last,mapT=0;
function update(dt,now){const p=cam.position;
  if(move){
    if(move.seg<move.path.length){const [tx,tz]=move.path[move.seg];const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
      let remain=d;for(let i=move.seg+1;i<move.path.length;i++){const [ax,az]=move.path[i-1],[bx,bz]=move.path[i];remain+=Math.hypot(bx-ax,bz-az)}
      const sp=Math.min(2.8,.6+Math.sqrt(2*2.2*Math.max(0,move.s))+0,.35+Math.sqrt(2*2.6*remain));const step=sp*dt;
      if(d<=step){p.x=tx;p.z=tz;move.seg++}else{p.x+=dx/d*step;p.z+=dz/d*step}move.s+=step;
      const want=(remain>1.3||move.fyaw==null)?(d>.05?Math.atan2(-dx,-dz):yaw):move.fyaw;yaw+=angDiff(yaw,want)*Math.min(1,dt*(remain>1.3?3.2:4.5));
      const wp=remain>1.3?0:(move.fpitch??pitch);pitch+=(wp-pitch)*Math.min(1,dt*3);
    }else{
      if(move.fyaw!=null)yaw+=angDiff(yaw,move.fyaw)*Math.min(1,dt*6);if(move.fpitch!=null)pitch+=(move.fpitch-pitch)*Math.min(1,dt*6);
      move.settle+=dt;if(move.settle>.35){const d=move.done;move=null;if(d)d()}
    }
  }else if(entered){
    let f=0,s=0,turn=0;if(keys.has('KeyW')||keys.has('ArrowUp'))f++;if(keys.has('KeyS')||keys.has('ArrowDown'))f--;if(keys.has('KeyA'))s--;if(keys.has('KeyD'))s++;
    if(keys.has('ArrowLeft')||keys.has('KeyQ'))turn++;if(keys.has('ArrowRight')||keys.has('KeyE'))turn--;yaw+=turn*1.7*dt;
    f+=joy.f;s+=joy.s;
    const run=keys.has('ShiftLeft')||keys.has('ShiftRight'),mag=Math.max(1,Math.hypot(f,s)),spd=2.3*(run?1.8:1);
    const tx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/mag*spd,tz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/mag*spd,kk=Math.min(1,dt*9);
    vel.x+=(tx-vel.x)*kk;vel.z+=(tz-vel.z)*kk;
    if(Math.abs(vel.x)+Math.abs(vel.z)>.01){p.x+=vel.x*dt;p.z+=vel.z*dt;resolve(p);if(!isLocked()&&!$('#panel').hidden&&(f||s))closePanel()}
    bob+=Math.hypot(vel.x,vel.z)*dt*5.5;
  }else{yaw=YAW0+Math.sin((now-t0)*.00015)*.18}
  p.y=EYE+(isLocked()?Math.sin(bob)*.018:0);cam.rotation.set(pitch,yaw,0);updateAim(now)}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt,now);renderer.render(scene,cam);
  if(entered&&now-mapT>80){drawMap();mapT=now}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

function enterNow(noLock){entered=true;$('#intro').hidden=true;$('#nav').hidden=false;$('#bottom').hidden=false;$('#map').hidden=false;$('#b-full').hidden=!showFull;if(coarse)joyEl.hidden=false;drawMap();setModeUI();if(!noLock&&mode==='fps')lock();else if(mode!=='fps')hint(8000);canvas.focus()}
if(location.hash==='#in'){history.replaceState(null,'',location.pathname+location.search);enterNow(true)}
$('#enter').onclick=()=>{entered=true;$('#intro').hidden=true;$('#nav').hidden=false;$('#bottom').hidden=false;$('#map').hidden=false;$('#b-full').hidden=!showFull;if(coarse)joyEl.hidden=false;drawMap();setModeUI();if(mode==='fps')lock();else hint(8000);canvas.focus()};
window.__GALLERY={W,TOUR,O,focus,walkTo,cam,sim:sec=>{for(let i=0;i<sec*30;i++)update(1/30,performance.now())},get loaded(){return loaded},get ready(){return roomParts>=roomTotal},enter:()=>$('#enter').click(),joy,setView:(x,z,y,p)=>{cam.position.set(x,EYE,z);yaw=y;pitch=p}};
})();
</script>

</body></html>
